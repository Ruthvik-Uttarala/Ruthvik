name: refresh profile stats\n\non:\n  schedule:\n    - cron: "17 5 * * *"\n  workflow_dispatch:\n  push:\n    paths:\n      - ".github/workflows/refresh-stats.yml"\n      - "scripts/generate_stats.py"\n\npermissions:\n  contents: write\n\njobs:\n  refresh:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - name: Generate profile graphics\n        env:\n          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}\n          GH_LOGIN: ${{ github.repository_owner }}\n        run: python3 scripts/generate_stats.py\n\n      - name: Commit changed graphics\n        run: |\n          FILES="assets/generated/stats.svg assets/generated/streak.svg assets/generated/langs.svg assets/generated/year.svg"\n          if [ -z "$(git status --porcelain -- $FILES)" ]; then\n            echo "No profile stats changed."\n            exit 0\n          fi\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add -- $FILES\n          git commit -m "stats: refresh profile"\n          git push